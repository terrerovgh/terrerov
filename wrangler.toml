# Cloudflare Workers, static assets only — there is no Worker script, just the
# files Astro writes into dist/. `wrangler deploy` uploads that directory.
#
# `_headers` inside dist/ still sets the cache and security headers; Workers
# static assets honours it the same way Pages did.
name = "terrerov"
compatibility_date = "2026-08-17"

[assets]
directory = "./dist"
