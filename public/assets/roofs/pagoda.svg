<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none" role="img" aria-label="Five-story pagoda roof cutout">
  <!-- Ink-on-paper pagoda, eaves at bottom for curtain hang -->
  <g stroke="#2e251f" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- finial -->
    <path d="M450 28 v52" stroke-width="3"/>
    <circle cx="450" cy="24" r="7" fill="#2e251f" stroke="none"/>
    <path d="M436 42 h28" stroke-width="2.5"/>

    <!-- tier 1 (top) -->
    <path d="M390 88 L450 68 L510 88 L500 100 L400 100 Z" fill="#2e251f" fill-opacity="0.12" stroke-width="2.2"/>
    <path d="M400 100 h100 v22 H400 Z" fill="#e8dfca" stroke-width="1.8"/>

    <!-- tier 2 -->
    <path d="M340 140 L450 112 L560 140 L540 158 L360 158 Z" fill="#2e251f" fill-opacity="0.14" stroke-width="2.2"/>
    <path d="M360 158 h180 v28 H360 Z" fill="#e8dfca" stroke-width="1.8"/>

    <!-- tier 3 -->
    <path d="M280 210 L450 172 L620 210 L590 236 L310 236 Z" fill="#2e251f" fill-opacity="0.16" stroke-width="2.4"/>
    <path d="M310 236 h280 v34 H310 Z" fill="#e8dfca" stroke-width="1.8"/>

    <!-- tier 4 -->
    <path d="M210 300 L450 248 L690 300 L650 336 L250 336 Z" fill="#2e251f" fill-opacity="0.18" stroke-width="2.5"/>
    <path d="M250 336 h400 v40 H250 Z" fill="#e8dfca" stroke-width="1.8"/>

    <!-- tier 5 (main eave — hang line ~ y 448–488) -->
    <path d="M110 420 L450 350 L790 420 L740 470 L160 470 Z" fill="#2e251f" fill-opacity="0.22" stroke-width="2.8"/>
    <path d="M160 470 h580 v28 H160 Z" fill="#e8dfca" stroke-width="1.8"/>
    <!-- eave underside detail -->
    <path d="M175 498 Q450 518 725 498" stroke-width="2" opacity="0.55"/>
    <path d="M200 488 Q450 508 700 488" stroke-width="1.4" opacity="0.35"/>
  </g>
  <!-- soft multiply-friendly body -->
  <g fill="#2e251f" fill-opacity="0.08" stroke="none">
    <path d="M400 100 h100 v22 H400 Z"/>
    <path d="M360 158 h180 v28 H360 Z"/>
    <path d="M310 236 h280 v34 H310 Z"/>
    <path d="M250 336 h400 v40 H250 Z"/>
  </g>
</svg>
